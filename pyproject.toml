[project]
name = "when-agents-cheat"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "inspect-ai",
  "datasets",
  "impossiblebench @ git+https://github.com/safety-research/impossiblebench@d4f9a149db2b9cec0fed7bab01d91c07ee10aca2",
  "openai>=3.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["when_agents_cheat"]
